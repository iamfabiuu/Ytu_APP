<svg xmlns="http://www.w3.org/2000/svg" width="120" height="140" viewBox="0 0 120 140" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Veleiro do YTU (vista lateral).
    Este arquivo é o ícone usado no mapa (src/map/boatIcons.ts).
    Para usar o desenho oficial da equipe, basta SUBSTITUIR este arquivo por
    outro SVG ou PNG com FUNDO TRANSPARENTE e o mesmo nome. Mantenha o tamanho
    proporcional (120 x 140) e deixe as ondas embaixo, se quiser.
  -->

  <!-- ondas -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="3.5" stroke-linecap="round">
    <path d="M4 127 q7 -6 14 0 t14 0 t14 0"/>
    <path d="M62 133 q7 -6 14 0 t14 0 t14 0"/>
  </g>

  <!-- vela grande -->
  <polygon points="57,14 15,92 54,90" fill="#F3E6CF"/>
  <!-- vela menor -->
  <polygon points="64,30 100,92 61,92" fill="#F3E6CF"/>
  <!-- mastro -->
  <polygon points="57,8 62,8 56,100 51,100" fill="#D8451F"/>
  <!-- casco: faixa vermelha -->
  <polygon points="8,96 112,100 110,108 12,105" fill="#D8451F"/>
  <!-- casco: parte clara -->
  <polygon points="14,108 108,111 94,124 30,122" fill="#F3E6CF"/>
</svg>
